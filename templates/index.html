<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Celeiro Familiar - Neural Finance</title>
    <!-- PWA & Apple Meta Tags para iPhone 14 Pro -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Celeiro Familiar">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyberBg: '#070B14',
                        cyberCard: '#0E1626',
                        cyberBorder: '#1E293B',
                        cyberNeon: '#00F2FE',
                        cyberGreen: '#10B981',
                        cyberRose: '#F43F5E',
                    },
                    boxShadow: {
                        'neon': '0 0 20px rgba(0, 242, 254, 0.1)',
                        'green-glow': '0 0 20px rgba(16, 185, 129, 0.15)',
                        'rose-glow': '0 0 20px rgba(244, 63, 94, 0.15)',
                    }
                }
            }
        }
    </script>
    <!-- Font Inter & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(14, 22, 38, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-cyberBg text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-black pb-12">
    
    <!-- Top Futuristic Header -->
    <header class="glass border-b border-cyberBorder sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-emerald-500 rounded-2xl blur opacity-30"></div>
                    <div class="relative bg-cyberCard border border-cyan-500/30 text-cyan-400 p-2.5 rounded-2xl font-mono font-bold text-base shadow-neon">CF</div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-bold text-base sm:text-xl tracking-wide bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">CELEIRO FAMILIAR</h1>
                    </div>
                    <p class="text-[11px] text-slate-400 font-mono">Denis & Nicole • Cloud / Local</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-2 bg-cyberCard border border-cyberBorder px-3 py-1.5 rounded-xl text-xs font-mono">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-emerald-400 hidden sm:inline">SYNC ACTIVE</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        
        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
            <!-- Saldo -->
            <div class="cyberCard glass p-5 sm:p-6 rounded-3xl border border-cyberBorder shadow-neon relative overflow-hidden">
                <p class="text-xs font-mono tracking-wider text-slate-400 uppercase">Saldo Consolidado</p>
                <h3 id="cardBalance" class="text-2xl sm:text-3xl font-mono font-bold mt-2 text-white">R$ 0,00</h3>
            </div>
            <!-- Entradas -->
            <div class="cyberCard glass p-5 sm:p-6 rounded-3xl border border-cyberBorder shadow-green-glow relative overflow-hidden">
                <p class="text-xs font-mono tracking-wider text-emerald-400 uppercase">Entradas Familiares</p>
                <h3 id="cardIncome" class="text-2xl sm:text-3xl font-mono font-bold mt-2 text-emerald-400">R$ 0,00</h3>
            </div>
            <!-- Saídas -->
            <div class="cyberCard glass p-5 sm:p-6 rounded-3xl border border-cyberBorder shadow-rose-glow relative overflow-hidden">
                <p class="text-xs font-mono tracking-wider text-rose-400 uppercase">Saídas e Despesas</p>
                <h3 id="cardExpense" class="text-2xl sm:text-3xl font-mono font-bold mt-2 text-rose-400">R$ 0,00</h3>
            </div>
        </div>

        <!-- Action Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Nova Transação Form -->
            <div class="cyberCard glass p-5 sm:p-6 rounded-3xl border border-cyberBorder shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-sm sm:text-base tracking-wide flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                        <span>Novo Lançamento</span>
                    </h2>
                </div>
                <form id="txForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-1">DESCRIÇÃO</label>
                        <input type="text" id="desc" required placeholder="Ex: Supermercado, Aluguel..." class="w-full bg-[#070B14] border border-cyberBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition font-mono">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-mono text-slate-400 mb-1">VALOR (R$)</label>
                            <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-[#070B14] border border-cyberBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-mono text-slate-400 mb-1">TIPO</label>
                            <select id="type" class="w-full bg-[#070B14] border border-cyberBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition font-mono">
                                <option value="expense">Despesa (-)</option>
                                <option value="income">Receita (+)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-mono text-slate-400 mb-1">CATEGORIA</label>
                            <select id="category" class="w-full bg-[#070B14] border border-cyberBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition font-mono">
                                <option value="Alimentação">Alimentação</option>
                                <option value="Moradia">Moradia</option>
                                <option value="Transporte">Transporte</option>
                                <option value="Lazer">Lazer</option>
                                <option value="Saúde">Saúde</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-mono text-slate-400 mb-1">RESPONSÁVEL</label>
                            <select id="user_name" class="w-full bg-[#070B14] border border-cyberBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition font-mono text-cyan-300 font-semibold">
                                <option value="Denis William">Denis William</option>
                                <option value="Nicole Santos">Nicole Santos</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-1">DATA</label>
                        <input type="date" id="date" class="w-full bg-[#070B14] border border-cyberBorder rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition font-mono">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-bold py-3.5 rounded-2xl transition shadow-lg shadow-cyan-500/20 uppercase font-mono tracking-wider text-xs">
                        Registrar Transação
                    </button>
                </form>
            </div>

            <!-- Transactions List -->
            <div class="lg:col-span-2 cyberCard glass p-5 sm:p-6 rounded-3xl border border-cyberBorder shadow-xl flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-sm sm:text-base tracking-wide flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span>Fluxo de Transações</span>
                    </h2>
                    <span id="txCount" class="text-xs font-mono text-slate-400">0 registros</span>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-cyberBorder text-xs font-mono text-slate-400">
                                <th class="py-3 px-3">DATA</th>
                                <th class="py-3 px-3">DESCRIÇÃO</th>
                                <th class="py-3 px-3">CATEGORIA</th>
                                <th class="py-3 px-3">QUEM</th>
                                <th class="py-3 px-3 text-right">VALOR</th>
                                <th class="py-3 px-3 text-center">DEL</th>
                            </tr>
                        </thead>
                        <tbody id="txTableBody" class="divide-y divide-cyberBorder text-sm font-mono">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        async function loadData() {
            try {
                const [summaryRes, txRes] = await Promise.all([
                    fetch('/api/summary'),
                    fetch('/api/transactions')
                ]);
                const summary = await summaryRes.json();
                const txs = await txRes.json();

                document.getElementById('cardBalance').innerText = `R$ ${summary.balance.toFixed(2)}`;
                document.getElementById('cardIncome').innerText = `R$ ${summary.total_income.toFixed(2)}`;
                document.getElementById('cardExpense').innerText = `R$ ${summary.total_expense.toFixed(2)}`;

                const tbody = document.getElementById('txTableBody');
                tbody.innerHTML = '';
                document.getElementById('txCount').innerText = `${txs.length} registros`;

                if (txs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-500 font-mono">NENHUM REGISTRO ENCONTRADO.</td></tr>`;
                    return;
                }

                txs.forEach(tx => {
                    const isIncome = tx.type === 'income';
                    const amountFormatted = (isIncome ? '+ ' : '- ') + `R$ ${Math.abs(tx.amount).toFixed(2)}`;
                    const amountClass = isIncome ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold';
                    
                    const userBadge = tx.user_name === 'Denis William' 
                        ? '<span class="px-2 py-0.5 rounded text-[11px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Denis</span>'
                        : '<span class="px-2 py-0.5 rounded text-[11px] bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20">Nicole</span>';

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/40 transition';
                    tr.innerHTML = `
                        <td class="py-3 px-3 text-xs text-slate-400">${tx.date}</td>
                        <td class="py-3 px-3 font-medium text-white">${tx.description}</td>
                        <td class="py-3 px-3"><span class="px-2 py-0.5 rounded text-[11px] bg-[#070B14] border border-cyberBorder text-slate-300">${tx.category}</span></td>
                        <td class="py-3 px-3 text-xs">${userBadge}</td>
                        <td class="py-3 px-3 text-right ${amountClass}">${amountFormatted}</td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="deleteTx(${tx.id})" class="text-slate-500 hover:text-rose-400 transition p-1">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Erro ao carregar dados:", err);
            }
        }

        async function addTransaction(e) {
            e.preventDefault();
            const data = {
                description: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                user_name: document.getElementById('user_name').value,
                date: document.getElementById('date').value
            };

            const res = await fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('desc').value = '';
                document.getElementById('amount').value = '';
                loadData();
            } else {
                alert('Erro ao registrar transação');
            }
        }

        async function deleteTx(id) {
            if (confirm('Deseja excluir este registro?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
